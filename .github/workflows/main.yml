name: Ecommerce CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ecommerce/package-lock.json

      - name: Install dependencies
        working-directory: ecommerce
        run: npm ci

      - name: Run tests
        working-directory: ecommerce
        run: npm test -- --watchAll=false

      - name: Build application
        working-directory: ecommerce
        run: npm run build

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Start React application
        working-directory: ecommerce
        run: npm start &

            - name: Run Selenium Login Test
        working-directory: ecommerce
        run: node selenium-tests/login.test.js

      - name: Run Selenium Cart Test
        working-directory: ecommerce
        run: node selenium-tests/cart.test.js